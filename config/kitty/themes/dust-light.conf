# Dust: the light half of the Quickshell palette (config/quickshell/Theme.qml).
# Same slot semantics as ember-dark.conf, so black is a raised (here: darker)
# surface and light-gray/white are dim/full text, both dark on this background.

foreground              #3a302a
background              #f5ede3
selection_foreground    none
selection_background    #c6beb5

cursor                  #b0521a
cursor_text_color       #f5ede3

url_color               #2b7383

active_border_color     #b0521a
inactive_border_color   #8f8173
bell_border_color       #8a5f0a

active_tab_foreground   #f5ede3
active_tab_background   #b0521a
inactive_tab_foreground #5e5249
inactive_tab_background #e6ded4
tab_bar_background      #e7dccd

mark1_foreground #f5ede3
mark1_background #3c6585
mark2_foreground #f5ede3
mark2_background #84506a
mark3_foreground #f5ede3
mark3_background #2b7383

# black, gray
color0  #d9d1c7
color8  #8f8173

# red, orange
color1  #b23a2c
color9  #b0521a

# green
color2  #5b7429
color10 #5b7429

# yellow
color3  #8a5f0a
color11 #8a5f0a

