# Ember: the dark half of the Quickshell palette (config/quickshell/Theme.qml).
# Slots follow base16 semantics so Helix's `ember` theme can use ANSI names in
# both modes: black is a raised surface, light-gray/white are dim/full text,
# gray is muted. Bright red/blue/magenta carry orange, sapphire and pink.

foreground              #ebdfd2
background              #1a1715
selection_foreground    none
selection_background    #4e4944

cursor                  #e8955e
cursor_text_color       #1a1715

url_color               #84b3bc

active_border_color     #e8955e
inactive_border_color   #7d6f64
bell_border_color       #ecc27a

active_tab_foreground   #1a1715
active_tab_background   #e8955e
inactive_tab_foreground #bcae9f
inactive_tab_background #2b2724
tab_bar_background      #12100f

mark1_foreground #1a1715
mark1_background #93acc0
mark2_foreground #1a1715
mark2_background #c9a2a8
mark3_foreground #1a1715
mark3_background #84b3bc

# black, gray
color0  #393531
color8  #7d6f64

# red, orange
color1  #e57a6a
color9  #e8955e

# green
color2  #b3bd85
color10 #b3bd85

# yellow
color3  #ecc27a
color11 #ecc27a

# blue, sapphire
color4  #93acc0
color12 #84b3bc

# mauve, pink
color5  #c9a2a8
color13 #dba08c

# teal
color6  #95bfae
color14 #95bfae

# dim text, text
color7  #bcae9f
color15 #ebdfd2
