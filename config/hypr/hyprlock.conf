general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date "+%A, %d %B %Y"
    color = rgba(205, 214, 244, 0.9)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 64
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgb(137, 180, 250)
    inner_color = rgb(17, 17, 27)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = Password...
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}
