[[language]]
name = "html"
# A user file-types list replaces Helix's built-in one, so repeat the 25.07
# defaults before adding Vento templates.
file-types = ["html", "htm", "shtml", "xhtml", "xht", "jsp", "asp", "aspx", "jshtm", "volt", "rhtml", "cshtml", "vto"]

[language-server.nixd]
command = "nixd"

[[language]]
name = "nix"
language-servers = ["nixd"]
auto-format = true
formatter = { command = "nixfmt" }

